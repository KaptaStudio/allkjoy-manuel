<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100vh;font-family:"Inter",sans-serif;
  background:#0a0f16;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;overscroll-behavior:none;
}
.scene{
  width:min(380px,92vw);
  height:min(608px,calc(92vw*1.6));
  perspective:1500px;
}
.card-inner{
  width:100%;height:100%;position:relative;
  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.card-inner.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;top:0;left:0;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;overflow:hidden;
}
.front{
  background:#f5f0e8;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px;position:relative;cursor:pointer;
}
.logo-main{width:88%;position:relative;overflow:hidden;}
.logo-main svg{width:100%;height:auto;display:block;}
.logo-main::after{
  content:'';position:absolute;top:-50%;left:-75%;
  width:50%;height:200%;
  background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:skewX(-20deg);
  animation:sh 3s ease-in-out infinite;animation-delay:.8s;
}
@keyframes sh{0%{left:-75%}65%,100%{left:130%}}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0);opacity:.45;}
  50%{box-shadow:0 0 0 4px rgba(255,255,255,.08);opacity:.75;}
}
@keyframes pulse-btn{
  0%,100%{opacity:.35;}
  50%{opacity:.7;}
}

.front-cue{
  position:absolute;bottom:18px;right:20px;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:#c8bfb0;display:flex;align-items:center;gap:4px;pointer-events:none;
}
.back{
  transform:rotateY(180deg);
  background:#0f1923;
  display:flex;flex-direction:column;
  padding:32px 28px 26px;
}
.b-logo{margin-bottom:26px;cursor:pointer;}
.b-name{
  font-size:20px;font-weight:700;
  color:#ffffff;line-height:1.15;
  margin-bottom:5px;letter-spacing:-.3px;
}
.b-cargo{
  font-size:10px;font-weight:300;
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55);
  margin-bottom:28px;
}
.b-line{
  width:32px;height:1px;
  background:#e30613;
  margin-bottom:26px;flex-shrink:0;
}
.b-contacts{
  display:flex;flex-direction:column;
  gap:16px;flex:1;
}
.ci{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding:6px 8px;
  border-radius:8px;
  margin:-6px -8px;
  transition:background .1s,transform .1s;
}
.ci:active{
  background:rgba(255,255,255,.08);
  transform:scale(.98);
}
.ci svg{flex-shrink:0;opacity:.65;}
.ci-text{display:flex;flex-direction:column;gap:1px;}
.ci-label{font-size:8px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.22);}
.ci-value{font-size:11px;font-weight:400;color:rgba(255,255,255,.65);}
.b-actions{
  display:flex;gap:18px;
  margin-bottom:20px;flex-shrink:0;
  padding-top:24px;
}
.b-btn{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;padding:0;
  font-family:"Inter",sans-serif;
  font-size:9px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
  cursor:pointer;text-decoration:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .1s,color .1s;
  animation:pulse-btn 2.5s ease-in-out infinite;
}
.b-btn:active{
  color:rgba(255,255,255,.9);
  transform:scale(.95);
}
.b-dot{width:4px;height:4px;border-radius:50%;background:#e30613;flex-shrink:0;}
.qr-wrap{display:none;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:14px;}
.qr-wrap.on{display:flex;}
.qr-lbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.2);}
.b-social{
  display:flex;align-items:center;justify-content:center;
  gap:22px;padding-top:18px;
  border-top:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.si{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;opacity:.45;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  transition:transform .1s,opacity .1s,background .1s;
  animation:pulse 2.5s ease-in-out infinite;
}
.si:active{
  transform:scale(.88);
  opacity:1;
  background:rgba(255,255,255,.15);
  border-color:rgba(255,255,255,.4);
}
</style>
